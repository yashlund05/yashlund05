<text x="64" y="246" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#fbbf24" opacity="0">I make ML small enough to live inside the kernel.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="0.0s" repeatCount="indefinite"/></text><text x="64" y="246" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#fbbf24" opacity="0">Predictive autoscaling that spends less energy.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="3.5s" repeatCount="indefinite"/></text><text x="64" y="246" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#fbbf24" opacity="0">Digital twins, and what breaks when they go stale.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="7.0s" repeatCount="indefinite"/></text><text x="64" y="246" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#fbbf24" opacity="0">Papers, hackathons, and things that ship.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="14s" begin="10.5s" repeatCount="indefinite"/></text>
