  <text x="600" y="22" text-anchor="middle" fill="#42526B" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="2">MISSION LOG // END OF TRANSMISSION</text>

  <!-- Right Radar Reticle -->
  <text x="1156" y="36" text-anchor="end" fill="#C9186F" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing="1.2">COMMS ARRAY</text>
