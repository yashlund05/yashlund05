        <text x="33" y="14.5" text-anchor="middle" fill="#05060A" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">OpenDSS</text>
      </g>
  <g transform="translate(163, 216)">
        <rect width="66" height="22" rx="4" fill="#EAF1FA" stroke="#B7CAE3" stroke-width="1"/>
        <text x="33" y="14.5" text-anchor="middle" fill="#05060A" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">PyTorch</text>
      </g>
  <g transform="translate(236, 216)">
        <rect width="66" height="22" rx="4" fill="#EAF1FA" stroke="#B7CAE3" stroke-width="1"/>
        <text x="33" y="14.5" text-anchor="middle" fill="#05060A" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">XGBoost</text>
      </g>
  <g transform="translate(309, 216)">
        <rect width="72" height="22" rx="4" fill="#EAF1FA" stroke="#B7CAE3" stroke-width="1"/>
        <text x="36" y="14.5" text-anchor="middle" fill="#05060A" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">Three.js</text>
      </g>
