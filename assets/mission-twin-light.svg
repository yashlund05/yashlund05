        <path d="M358,126 C378,86 398,86 418,126 C438,166 458,166 478,126 C498,86 518,86 532,114" fill="none" stroke="#C9186F" stroke-width="1.8" stroke-dasharray="5 3"/>
        <animateTransform attributeName="transform" type="translate" values="2 0;16 0;2 0" dur="3.8s" repeatCount="indefinite"/>
      </g>
      <!-- Bus Nodes -->
      <line x1="364" y1="178" x2="524" y2="178" stroke="#007B8A" stroke-width="1.6"/>
      <circle cx="368" cy="178" r="4" fill="#B6FF00">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0s" repeatCount="indefinite"/>
      </circle><circle cx="408" cy="178" r="4" fill="#B6FF00">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0.25s" repeatCount="indefinite"/>
      </circle><circle cx="448" cy="178" r="4" fill="#B6FF00">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
      </circle><circle cx="488" cy="178" r="4" fill="#FF2E97">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="0.75s" repeatCount="indefinite"/>
      </circle><circle cx="520" cy="178" r="4" fill="#B6FF00">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="358" y="194" fill="#42526B" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8.5">DELTA-T SWEEP: 0s TO 300s</text>
  </g>

  <!-- Bottom Tech Tag Chips -->
  <g transform="translate(24, 216)">
        <rect width="59" height="22" rx="4" fill="#EAF1FA" stroke="#B7CAE3" stroke-width="1"/>
        <text x="29.5" y="14.5" text-anchor="middle" fill="#05060A" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">Python</text>
      </g>
  <g transform="translate(90, 216)">
