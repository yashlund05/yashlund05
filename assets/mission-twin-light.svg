<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-label="DIGITAL TWIN STALENESS mission card">
  <defs>
    <clipPath id="clip-twin-light">
      <rect x="348" y="54" width="194" height="148" rx="6"/>
    </clipPath>
  </defs>
  <rect width="560" height="260" fill="#F4F7FB" rx="8"/>
