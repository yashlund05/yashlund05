  <path d="M6,22 L6,6 L22,6" fill="none" stroke="#4D7300" stroke-width="2" stroke-linecap="square"/>
    <path d="M538,6 L554,6 L554,22" fill="none" stroke="#4D7300" stroke-width="2" stroke-linecap="square"/>
    <path d="M554,238 L554,254 L538,254" fill="none" stroke="#4D7300" stroke-width="2" stroke-linecap="square"/>
    <path d="M22,254 L6,254 L6,238" fill="none" stroke="#4D7300" stroke-width="2" stroke-linecap="square"/>

  <!-- Top Mission Bar -->
  <rect x="20" y="16" width="520" height="26" rx="4" fill="#EAF1FA" stroke="#B7CAE3" stroke-width="1"/>
  <circle cx="34" cy="29" r="4" fill="#B6FF00">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="46" y="33" fill="#4D7300" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.2">MSN-03 // TELEMETRY</text>
  <rect x="382" y="20" width="150" height="18" rx="3" fill="#F4F7FB" stroke="#4D7300" stroke-width="1" opacity="0.9"/>
  <text x="457" y="32.5" text-anchor="middle" fill="#4D7300" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">SUBMISSION FREEZE</text>

  <!-- Left Info Column (x=24..334) -->
  <text x="24" y="76" fill="#05060A" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="800" letter-spacing="0.4">DIGITAL TWIN STALENESS</text>
  <line x1="24" y1="88" x2="332" y2="88" stroke="#4D7300" stroke-width="1.5" opacity="0.65"/>
  <text x="24" y="114" fill="#05060A" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5">Quantifying sync staleness on IEEE feeders</text>
  <text x="24" y="133" fill="#05060A" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5">for load estimation &amp; anomaly detection.</text>
  <rect x="24" y="154" width="308" height="24" rx="4" fill="#F4F7FB" stroke="#D4DFEE" stroke-width="1"/>
  <text x="34" y="170" fill="#42526B" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.6">DOMAIN: IEEE 13/33/123-BUS // AoI STUDY</text>
  <line x1="24" y1="194" x2="332" y2="194" stroke="#D4DFEE" stroke-width="1"/>

  <!-- Right Kinetic Telemetry Panel -->
  <rect x="348" y="54" width="194" height="148" rx="6" fill="#F4F7FB" stroke="#B7CAE3" stroke-width="1.1"/>
  <g clip-path="url(#clip-twin-light)">
    
      <text x="358" y="70" fill="#4D7300" font-family="'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="700">PHY vs TWIN PHASE DRIFT</text>
      <line x1="358" y1="126" x2="532" y2="126" stroke="#D4DFEE" stroke-width="1"/>
      <!-- Physical Signal -->
      <path d="M358,126 C378,86 398,86 418,126 C438,166 458,166 478,126 C498,86 518,86 532,114" fill="none" stroke="#4D7300" stroke-width="2.2"/>
      <!-- Stale Cyber Signal oscillating horizontally -->
