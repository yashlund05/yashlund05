name: Refresh System Status HUD

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/system-status.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: system-status
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate System Status SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const MONO = "'JetBrains Mono','Fira Code','Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
          const THEMES = {
            dark: {
              mode: 'dark',
              bg: '#05060A',
              panel: '#0B0F19',
              panel2: '#0F1626',
              grid: '#162238',
              border: '#1E3252',
              cyan: '#00F0FF',
              cyanBright: '#00F0FF',
              magenta: '#FF2E97',
              magentaBright: '#FF2E97',
              acid: '#B6FF00',
              acidBright: '#B6FF00',
              text: '#E6F4FF',
              muted: '#7F95B3',
            },
            light: {
              mode: 'light',
              bg: '#F4F7FB',
              panel: '#FFFFFF',
              panel2: '#EAF1FA',
              grid: '#D4DFEE',
              border: '#B7CAE3',
              cyan: '#007B8A',
              cyanBright: '#00C4D9',
              magenta: '#C9186F',
              magentaBright: '#FF2E97',
              acid: '#4D7300',
              acidBright: '#B6FF00',
              text: '#05060A',
              muted: '#42526B',
            },
          };

          const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          const chamferPath = (x, y, w, h, c = 16) =>
            `M${x + c},${y} L${x + w - c},${y} L${x + w},${y + c} L${x + w},${y + h - c} L${x + w - c},${y + h} L${x + c},${y + h} L${x},${y + h - c} L${x},${y + c} Z`;
          const cornerBrackets = (x, y, w, h, len, color, sw = 2) =>
            [
              `M${x},${y + len} L${x},${y} L${x + len},${y}`,
              `M${x + w - len},${y} L${x + w},${y} L${x + w},${y + len}`,
              `M${x + w},${y + h - len} L${x + w},${y + h} L${x + w - len},${y + h}`,
              `M${x + len},${y + h} L${x},${y + h} L${x},${y + h - len}`,
            ]
              .map((d) => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="square"/>`)
              .join('\n    ');

          function formatUtc(iso) {
            const d = new Date(iso);
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
          }

          function formatIst(date) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Kolkata',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
            }).formatToParts(date);
            const map = Object.fromEntries(parts.map((x) => [x.type, x.value]));
            const hr = map.hour === '24' ? '00' : map.hour;
            return `${map.year}-${map.month}-${map.day} ${hr}:${map.minute} IST`;
          }

          function renderSystemStatus(t, meta) {
            const frameD = chamferPath(8, 8, 1184, 279, 16);
            const modules = [
              { name: 'PYTHON', col: 'cyan', icon: 'M6,2 L14,2 L14,8 L6,8 Z M2,6 L10,6 L10,14 L2,14 Z' },
              { name: 'C / eBPF', col: 'magenta', icon: 'M12,3 A6,6 0 1,0 12,13 M4,8 L14,8' },
              { name: 'GO', col: 'cyan', icon: 'M2,6 L14,6 M4,10 L13,10 M9,3 L14,8 L9,13' },
              { name: 'PYTORCH', col: 'magenta', icon: 'M8,2 C11,5 13,7 13,10 A5,5 0 1,1 3,10 C3,8 4,6 6,5' },
              { name: 'KUBERNETES', col: 'cyan', icon: 'M8,2 L13.5,5.5 L12,12.5 L4,12.5 L2.5,5.5 Z' },
              { name: 'LIGHTGBM', col: 'acid', icon: 'M3,13 L7,8 L10,10 L14,3 M11,3 L14,3 L14,6' },
              { name: 'OR-TOOLS', col: 'acid', icon: 'M3,4 L13,4 L8,13 Z M5,9 L11,9' },
              { name: 'OPENDSS', col: 'cyan', icon: 'M9,2 L4,9 L8,9 L7,14 L12,7 L8,7 Z' },
              { name: 'TYPESCRIPT', col: 'magenta', icon: 'M2,3 L14,3 L14,13 L2,13 Z M5,7 L9,7 M7,7 L7,11' },
            ];
            const chips = modules
              .map((m, idx) => {
                const col = idx % 3;
                const row = Math.floor(idx / 3);
                const x = 588 + col * 194;
                const y = 78 + row * 50;
                const c = t[m.col];
                const delay = (idx * 0.35).toFixed(2);
                return [
                  `<g transform="translate(${x}, ${y})">`,
                  `  <rect width="182" height="40" rx="5" fill="${t.panel2}" stroke="${t.border}" stroke-width="1.1"/>`,
                  `  <rect x="0" y="6" width="3" height="28" rx="1.5" fill="${c}"/>`,
                  `  <g transform="translate(12, 12)">`,
                  `    <path d="${m.icon}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`,
                  `  </g>`,
                  `  <text x="36" y="24" fill="${t.text}" font-family="${MONO}" font-size="11.5" font-weight="700" letter-spacing="0.8">${esc(m.name)}</text>`,
                  `  <circle cx="166" cy="20" r="3.5" fill="${t.acidBright}">`,
                  `    <animate attributeName="opacity" values="1;0.25;1" dur="2.1s" begin="${delay}s" repeatCount="indefinite"/>`,
                  `  </circle>`,
                  `</g>`,
                ].join('\n');
              })
              .join('\n');

            return [
              `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 295" width="1200" height="295" role="img" aria-label="System Status HUD for yashlund05">`,
              `  <defs>`,
              `    <pattern id="ssGrid-${t.mode}" width="32" height="32" patternUnits="userSpaceOnUse">`,
              `      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="${t.grid}" stroke-width="0.7"/>`,
              `    </pattern>`,
              `  </defs>`,
              `  <rect width="1200" height="295" fill="${t.bg}" rx="8"/>`,
              `  <path d="${frameD}" fill="${t.panel}" stroke="${t.border}" stroke-width="1.4"/>`,
              `  <path d="${frameD}" fill="url(#ssGrid-${t.mode})" opacity="0.5"/>`,
              `  ${cornerBrackets(8, 8, 1184, 279, 20, t.cyan, 2)}`,
              `  <rect x="22" y="18" width="1156" height="32" rx="4" fill="${t.panel2}" stroke="${t.border}" stroke-width="1"/>`,
              `  <circle cx="40" cy="34" r="4.5" fill="${t.magentaBright}"/>`,
              `  <circle cx="56" cy="34" r="4.5" fill="${t.cyanBright}"/>`,
              `  <circle cx="72" cy="34" r="4.5" fill="${t.acidBright}"/>`,
              `  <text x="92" y="38" fill="${t.text}" font-family="${MONO}" font-size="12" font-weight="700" letter-spacing="1.2">TERMINAL://SYSTEM_STATUS // YASHLUND05</text>`,
              `  <circle cx="1076" cy="34" r="4" fill="${t.acidBright}">`,
              `    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>`,
              `  </circle>`,
              `  <text x="1162" y="38" text-anchor="end" fill="${t.acid}" font-family="${MONO}" font-size="11" font-weight="700" letter-spacing="1">LIVE TELEMETRY</text>`,
              `  <rect x="22" y="62" width="546" height="172" rx="6" fill="${t.bg}" stroke="${t.border}" stroke-width="1.1"/>`,
              `  <text x="38" y="84" fill="${t.cyan}" font-family="${MONO}" font-size="11" font-weight="700" letter-spacing="1.4">$ cat /proc/mission/operator.conf</text>`,
              `  <line x1="38" y1="94" x2="550" y2="94" stroke="${t.grid}" stroke-width="1"/>`,
              `  <g font-family="${MONO}" font-size="12">`,
              `    <text x="38" y="118" fill="${t.muted}">ROLE   :</text>`,
              `    <text x="112" y="118" fill="${t.text}" font-weight="700">AI &amp; Systems Researcher</text>`,
              `    <text x="38" y="146" fill="${t.muted}">FOCUS  :</text>`,
              `    <text x="112" y="146" fill="${t.text}">ML under latency, staleness &amp; compute budgets</text>`,
              `    <text x="38" y="174" fill="${t.muted}">TRACKS :</text>`,
              `    <text x="112" y="174" fill="${t.cyan}">Predictive K8s · Linux sched_ext · IEEE Twins</text>`,
              `    <text x="38" y="202" fill="${t.muted}">ORIGIN :</text>`,
              `    <text x="112" y="202" fill="${t.text}">India (IST, UTC+05:30) // Channels Open</text>`,
              `  </g>`,
              `  <rect x="38" y="216" width="512" height="4" rx="2" fill="${t.grid}"/>`,
              `  <rect x="38" y="216" width="110" height="4" rx="2" fill="${t.cyan}">`,
              `    <animate attributeName="x" values="38;440;38" dur="6s" repeatCount="indefinite"/>`,
              `  </rect>`,
              `  <text x="588" y="70" fill="${t.magenta}" font-family="${MONO}" font-size="11" font-weight="700" letter-spacing="1.3">LOADED KERNEL &amp; ML MODULES [09 ACTIVE]</text>`,
              chips,
              `  <rect x="22" y="244" width="1156" height="32" rx="4" fill="${t.panel2}" stroke="${t.border}" stroke-width="1"/>`,
              `  <text x="38" y="264" fill="${t.acid}" font-family="${MONO}" font-size="11.5" font-weight="700">LAST_COMMIT:</text>`,
              `  <text x="134" y="264" fill="${t.text}" font-family="${MONO}" font-size="11.5">${esc(meta.lastCommit)}</text>`,
              `  <text x="588" y="264" fill="${t.muted}" font-family="${MONO}" font-size="11.5">|</text>`,
              `  <text x="608" y="264" fill="${t.cyan}" font-family="${MONO}" font-size="11.5" font-weight="700">LOCAL_TIME:</text>`,
              `  <text x="698" y="264" fill="${t.text}" font-family="${MONO}" font-size="11.5">${esc(meta.localTime)}</text>`,
              `  <text x="916" y="264" fill="${t.muted}" font-family="${MONO}" font-size="11.5">|</text>`,
              `  <text x="936" y="264" fill="${t.muted}" font-family="${MONO}" font-size="11">SYNC: 6H ACTION</text>`,
              `  <rect x="1152" y="253" width="8" height="14" fill="${t.acidBright}">`,
              `    <animate attributeName="opacity" values="1;0;1" dur="0.95s" repeatCount="indefinite"/>`,
              `  </rect>`,
              `</svg>`,
              '',
            ].join('\n');
          }

          (async () => {
            const owner = process.env.OWNER || 'yashlund05';
            const token = process.env.GITHUB_TOKEN || '';
            let lastCommit = 'Awaiting telemetry sync';

            try {
              const headers = {
                'Accept': 'application/vnd.github+json',
                'User-Agent': `${owner}-mission-control`,
              };
              if (token) headers['Authorization'] = `Bearer ${token}`;
              const res = await fetch(`https://api.github.com/users/${owner}/repos?sort=pushed&per_page=15&type=owner`, { headers });
              if (res.ok) {
                const repos = await res.json();
                const target =
                  repos.find((r) => !r.fork && r.name.toLowerCase() !== owner.toLowerCase()) ||
                  repos.find((r) => r.name.toLowerCase() !== owner.toLowerCase()) ||
                  repos[0];
                if (target && target.pushed_at) {
                  const shortName = target.name.length > 24 ? `${target.name.slice(0, 21)}...` : target.name;
                  lastCommit = `${formatUtc(target.pushed_at)} (${shortName})`;
                }
              }
            } catch (err) {
              console.warn('GitHub API lookup failed, using fallback label:', err.message);
            }

            const meta = {
              lastCommit,
              localTime: formatIst(new Date()),
            };

            fs.mkdirSync('assets', { recursive: true });
            fs.writeFileSync(path.join('assets', 'system-status-dark.svg'), renderSystemStatus(THEMES.dark, meta), 'utf8');
            fs.writeFileSync(path.join('assets', 'system-status-light.svg'), renderSystemStatus(THEMES.light, meta), 'utf8');
            console.log('Generated system-status SVGs:', meta);
          })();
          EOF

      - name: Commit updated System Status SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/system-status-dark.svg assets/system-status-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "telemetry: refresh system status [skip ci]"
            git pull --rebase origin main
            git push
          fi
